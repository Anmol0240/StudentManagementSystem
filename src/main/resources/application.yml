server:
  port: 8080

spring:
  application:
    name: student-management-system

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sms_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:sms_user}
    password: ${DB_PASSWORD:sms_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  devtools:
    restart:
      enabled: true

# JWT configuration (placeholder values - override via environment variables in production)
app:
  jwt:
    secret: ${JWT_SECRET:this-is-a-placeholder-secret-key-replace-in-production-and-keep-it-safe-256bit}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000}      # 15 minutes
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.enterprise.sms: DEBUG
    org.hibernate.SQL: DEBUG
